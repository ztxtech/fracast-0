# Shared Fracast pretraining recipe.
#
# The model is a single full-resolution stream.  A shared dilated-convolution
# block is reused across scales; the decoder receives seasonal future states.
inherit: ../base.yaml

_run:
  kind: train
  tag: fracast

model:
  family: fracast

pyramid:
  ratios: []
  mode: none
  time_rope: false
  level_embed: false

data:
  corpus_dirs: []
  window_mode: raw
  level_norm: window_minmax
  max_channels: 1
  num_workers: 8

train:
  out_dir: output/fracast-0
  resume: auto
  amp: true
  compile: true
  fused_optim: true
